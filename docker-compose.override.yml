# Dev overrides — auto-loaded by `docker compose up`
# Mounts source code, enables hot reload, disables Traefik, exposes ports directly
services:
  traefik:
    profiles: ["never"] # Disabled in dev — access backend directly on :3000

  backend:
    working_dir: /app/apps/backend
    environment:
      ENABLE_SIMULATION_BYPASS: "true"
      DEBUG_DATING_PROGRESSION: "${DEBUG_DATING_PROGRESSION:-false}"
      DISABLE_DATING_MILESTONE_POLICY: "${DISABLE_DATING_MILESTONE_POLICY:-false}"
    ports:
      - "3000:3000"
    labels: []
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
    command: ["bun", "--watch", "run", "/app/apps/backend/index.ts"]

  worker:
    working_dir: /app/apps/backend
    environment:
      DEBUG_DATING_PROGRESSION: "${DEBUG_DATING_PROGRESSION:-false}"
      DISABLE_DATING_MILESTONE_POLICY: "${DISABLE_DATING_MILESTONE_POLICY:-false}"
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
    command: ["bun", "--watch", "run", "/app/apps/backend/worker.ts"]

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
