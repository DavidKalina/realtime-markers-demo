<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Card gradients -->
    <linearGradient id="grad0" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="rgb(134, 239, 172)" stop-opacity="0.3"/>
      <stop offset="1" stop-color="rgb(134, 239, 172)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="rgb(251, 191, 36)" stop-opacity="0.3"/>
      <stop offset="1" stop-color="rgb(251, 191, 36)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="rgb(168, 85, 247)" stop-opacity="0.3"/>
      <stop offset="1" stop-color="rgb(168, 85, 247)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="rgb(56, 189, 248)" stop-opacity="0.3"/>
      <stop offset="1" stop-color="rgb(56, 189, 248)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="rgb(52, 211, 153)" stop-opacity="0.3"/>
      <stop offset="1" stop-color="rgb(52, 211, 153)" stop-opacity="0"/>
    </linearGradient>

    <!-- Background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)"/>

  <!-- Cards container - centered -->
  <g transform="translate(512, 512)">

    <!-- Card 0: green 🎸, angle=-18, yOffset=44 -->
    <g transform="rotate(-18) translate(0, 44)">
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="#141414" stroke="rgba(134, 239, 172, 0.5)" stroke-width="5"/>
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="url(#grad0)"/>
      <text x="0" y="-20" text-anchor="middle" font-size="140">🎸</text>
      <rect x="-132" y="80" width="264" height="16" rx="8" fill="rgba(134, 239, 172, 0.5)" opacity="0.4"/>
      <rect x="-88" y="112" width="176" height="16" rx="8" fill="rgba(134, 239, 172, 0.5)" opacity="0.25"/>
    </g>

    <!-- Card 1: amber 🥾, angle=-9, yOffset=11 -->
    <g transform="rotate(-9) translate(0, 11)">
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="#141414" stroke="rgba(251, 191, 36, 0.5)" stroke-width="5"/>
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="url(#grad1)"/>
      <text x="0" y="-20" text-anchor="middle" font-size="140">🥾</text>
      <rect x="-132" y="80" width="264" height="16" rx="8" fill="rgba(251, 191, 36, 0.5)" opacity="0.4"/>
      <rect x="-88" y="112" width="176" height="16" rx="8" fill="rgba(251, 191, 36, 0.5)" opacity="0.25"/>
    </g>

    <!-- Card 2: purple 🎨, angle=0, yOffset=0 -->
    <g transform="rotate(0) translate(0, 0)">
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="#141414" stroke="rgba(168, 85, 247, 0.5)" stroke-width="5"/>
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="url(#grad2)"/>
      <text x="0" y="-20" text-anchor="middle" font-size="140">🎨</text>
      <rect x="-132" y="80" width="264" height="16" rx="8" fill="rgba(168, 85, 247, 0.5)" opacity="0.4"/>
      <rect x="-88" y="112" width="176" height="16" rx="8" fill="rgba(168, 85, 247, 0.5)" opacity="0.25"/>
    </g>

    <!-- Card 3: sky blue 🍳, angle=9, yOffset=11 -->
    <g transform="rotate(9) translate(0, 11)">
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="#141414" stroke="rgba(56, 189, 248, 0.5)" stroke-width="5"/>
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="url(#grad3)"/>
      <text x="0" y="-20" text-anchor="middle" font-size="140">🍳</text>
      <rect x="-132" y="80" width="264" height="16" rx="8" fill="rgba(56, 189, 248, 0.5)" opacity="0.4"/>
      <rect x="-88" y="112" width="176" height="16" rx="8" fill="rgba(56, 189, 248, 0.5)" opacity="0.25"/>
    </g>

    <!-- Card 4: teal 🏄, angle=18, yOffset=44 -->
    <g transform="rotate(18) translate(0, 44)">
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="#141414" stroke="rgba(52, 211, 153, 0.5)" stroke-width="5"/>
      <rect x="-220" y="-308" width="440" height="616" rx="40" fill="url(#grad4)"/>
      <text x="0" y="-20" text-anchor="middle" font-size="140">🏄</text>
      <rect x="-132" y="80" width="264" height="16" rx="8" fill="rgba(52, 211, 153, 0.5)" opacity="0.4"/>
      <rect x="-88" y="112" width="176" height="16" rx="8" fill="rgba(52, 211, 153, 0.5)" opacity="0.25"/>
    </g>

  </g>
</svg>
